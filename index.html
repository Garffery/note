<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技术博客 · 笔记</title>
<style>
  :root{
    --bg:#fbfbfc; --card:#ffffff; --ink:#1f2330; --muted:#6b7280;
    --line:#e7e9ee; --accent:#4f46e5; --accent-soft:#eef2ff;
    --ok:#059669; --ok-soft:#ecfdf5;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",-apple-system,sans-serif;
    line-height:1.75; font-size:15.5px;
  }
  .wrap{max-width:960px; margin:0 auto; padding:0 24px 80px}
  header.hero{
    background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 50%,#9333ea 100%);
    color:#fff; padding:60px 24px 50px; margin-bottom:24px;
  }
  .hero-inner{max-width:960px; margin:0 auto}
  header.hero .tag{
    display:inline-block; background:rgba(255,255,255,.18); padding:4px 12px;
    border-radius:999px; font-size:12.5px; letter-spacing:.5px; margin-bottom:14px;
  }
  header.hero h1{margin:0 0 10px; font-size:32px; line-height:1.3; font-weight:700}
  header.hero p{margin:0; opacity:.88; font-size:15px; max-width:600px; line-height:1.6}
  header.hero .meta{margin-top:18px; font-size:12.5px; opacity:.75}

  .section-title{
    font-size:13px; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--muted); margin:36px 0 16px; font-weight:600;
  }

  .article-list{display:flex; flex-direction:column; gap:16px}

  .article-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:24px 28px; box-shadow:0 1px 3px rgba(0,0,0,.03);
    transition:box-shadow .2s, transform .15s;
    cursor:pointer; text-decoration:none; color:inherit; display:block;
  }
  .article-card:hover{
    box-shadow:0 6px 24px rgba(0,0,0,.08); transform:translateY(-1px);
    border-color:var(--accent);
  }
  .article-card h2{margin:0 0 8px; font-size:20px; color:var(--ink); line-height:1.4}
  .article-card:hover h2{color:var(--accent)}
  .article-card .desc{
    margin:0 0 14px; color:var(--muted); font-size:14.5px; line-height:1.65;
  }
  .article-card .footer{
    display:flex; align-items:center; gap:14px; font-size:13px; color:var(--muted);
    flex-wrap:wrap;
  }
  .article-card .tags{display:flex; gap:8px; flex-wrap:wrap}
  .article-card .tag-item{
    background:var(--accent-soft); color:var(--accent); padding:2px 10px;
    border-radius:999px; font-size:12px; font-weight:500;
  }
  .article-card .date{font-size:12.5px}

  .empty-hint{
    text-align:center; padding:48px 0; color:var(--muted);
  }
  .empty-hint .icon{font-size:48px; margin-bottom:12px; display:block}

  footer{
    text-align:center; color:var(--muted); font-size:13px; margin-top:48px; padding-top:24px;
    border-top:1px solid var(--line);
  }
  footer a{color:var(--accent); text-decoration:none}
  footer a:hover{text-decoration:underline}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <span class="tag">技术笔记</span>
    <h1>Python · 异步编程 · 工程实践</h1>
    <p>记录学习过程中的技术笔记与深度分析，涵盖 Python 异步编程、系统设计等方向。</p>
    <div class="meta">持续更新中</div>
  </div>
</header>

<div class="wrap">

  <div class="section-title">文章列表</div>

  <div class="article-list">

    <a class="article-card" href="asyncio-core-concepts-enhanced.html">
      <h2>asyncio 核心概念详解（增强版）——协程 · 任务 · Future</h2>
      <p class="desc">
        从"会用"升级到"懂原理、会选型"。深入剖析协程、Task、Future 三者的定义、关系与底层原理，
        结合状态流转图解、回调转异步实战、线程池协作模型，并覆盖 LangGraph Agent 等真实业务场景的选型指南。
      </p>
      <div class="footer">
        <div class="tags">
          <span class="tag-item">Python</span>
          <span class="tag-item">asyncio</span>
          <span class="tag-item">协程</span>
          <span class="tag-item">Task</span>
          <span class="tag-item">Future</span>
        </div>
        <span class="date">2026-07</span>
      </div>
    </a>

  </div>

</div>

<footer>
  Powered by <a href="https://pages.github.com" target="_blank">GitHub Pages</a>
</footer>

</body>
</html>
